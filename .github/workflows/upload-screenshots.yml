name: Upload App Store Screenshots

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 -d > AuthKey.p8
          mkdir -p ~/private_keys
          cp AuthKey.p8 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Upload screenshots via fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Create API key JSON for fastlane
          KEY_CONTENT=$(cat AuthKey.p8 | sed '1d;$d' | tr -d '\n')
          cat > api_key.json << EOF
          {
            "key_id": "$APP_STORE_CONNECT_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "-----BEGIN PRIVATE KEY-----\n${KEY_CONTENT}\n-----END PRIVATE KEY-----"
          }
          EOF
          
          gem install fastlane
          
          fastlane deliver \
            --api_key_path api_key.json \
            --app_id 6798569405 \
            --screenshots screenshots/ \
            --skip_metadata \
            --skip_binary \
            --overwrite_screenshots
