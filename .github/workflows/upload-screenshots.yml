name: Upload App Store Screenshots

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload screenshots
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          
          # Clone repo
          git clone https://github.com/VeyraMeds/Veyra-ios.git /tmp/repo
          
          # Verify screenshots exist
          echo "=== Screenshots ==="
          ls -la /tmp/repo/screenshots/
          
          # Install fastlane
          echo "=== Installing fastlane ==="
          sudo gem install fastlane --no-document 2>&1 | tail -3
          
          # Decode API key
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 -d > /tmp/AuthKey.p8
          mkdir -p ~/.private_keys
          cp /tmp/AuthKey.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # Create API key JSON - properly escaped
          python3 -c "
          import json
          with open('/tmp/AuthKey.p8') as f:
              key = f.read()
          data = {
              'key_id': '$APP_STORE_CONNECT_KEY_ID',
              'issuer_id': '$APP_STORE_CONNECT_ISSUER_ID',
              'key': key
          }
          with open('/tmp/api_key.json', 'w') as f:
              json.dump(data, f)
          print('API key JSON created')
          "
          
          echo "=== Uploading screenshots ==="
          fastlane deliver \
            --api_key_path /tmp/api_key.json \
            --app_id 6798569405 \
            --screenshots /tmp/repo/screenshots/ \
            --skip_metadata \
            --skip_binary \
            --overwrite_screenshots \
            --force \
            --run_precheck_before_submit false \
            --verbose
