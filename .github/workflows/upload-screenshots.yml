name: Upload App Store Screenshots

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Clone repo
          git clone https://github.com/VeyraMeds/Veyra-ios.git /tmp/repo
          cd /tmp/repo
          
          # Verify screenshots
          echo "=== Screenshots ==="
          ls -la screenshots/
          
          # Install fastlane
          echo "=== Installing fastlane ==="
          sudo gem install fastlane --no-document 2>&1 | tail -3
          
          # Decode API key
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 -d > /tmp/AuthKey.p8
          mkdir -p ~/.private_keys
          cp /tmp/AuthKey.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # Create API key JSON
          KEY_CONTENT=$(cat /tmp/AuthKey.p8)
          cat > /tmp/api_key.json << KEYJSON
          {
            "key_id": "$APP_STORE_CONNECT_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "$KEY_CONTENT"
          }
          KEYJSON
          
          echo "=== Uploading screenshots ==="
          fastlane deliver \
            --api_key_path /tmp/api_key.json \
            --app_id 6798569405 \
            --screenshots /tmp/repo/screenshots/ \
            --skip_metadata \
            --skip_binary \
            --overwrite_screenshots \
            --verbose
